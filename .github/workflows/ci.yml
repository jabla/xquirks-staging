name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels the run of its older head. Push and manual runs have a
  # group of their own (the run id): never queued, never cancelled.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install -r tests_hacs/requirements.txt
      # The finder tests run the page's modules in node, which the runner image ships (they fail
      # without it in CI).
      - run: python -m pytest tests_hacs -q

  content:
    name: The newest content tag reads with this integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: The newest content-<n> tag through this integration's parsers and guard
        # A change to the integration must still read what users get today. Content built for
        # another guard is only parsed: a release takes only content for its own guard.
        run: |
          git fetch -q --no-tags origin 'refs/tags/content-*:refs/tags/content-*'
          tag=$(git for-each-ref --sort=-v:refname --count=1 --format='%(refname:strip=2)' 'refs/tags/content-*')
          if [ -z "$tag" ]; then
            echo "::notice::no content tag yet"
            exit 0
          fi
          if ! [[ "$tag" =~ ^content-[1-9][0-9]*$ ]]; then
            echo "::error::the newest content tag $tag is not content-<n>"
            exit 1
          fi
          mkdir "$RUNNER_TEMP/content"
          git archive "$tag" | tar -x -C "$RUNNER_TEMP/content"
          python -I tools/check_content.py "$RUNNER_TEMP/content" --tag "$tag"

  hacs:
    name: HACS validation
    # Not in forks: the action validates the repository by its name.
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # hacs/action only starts ghcr.io/hacs/action:main, a tag that moves. The same image by
      # digest, with the inputs the action would pass.
      - uses: docker://ghcr.io/hacs/action@sha256:187499a09c5d41f9f0d42ff80d203ed87b974c028290140913b61e005fb0aab2 # main
        env:
          INPUT_CATEGORY: integration
          # The brand images ship with the integration (custom_components/xquirks/brand/).
          INPUT_IGNORE: brands
          INPUT_GITHUB_TOKEN: ${{ github.token }}

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image validates every integration under /github/workspace: only custom_components is
      # mounted. ghcr.io/home-assistant/hassfest:2026.11.0 by digest.
      - run: docker run --rm -v "$GITHUB_WORKSPACE/custom_components:/github/workspace/custom_components:ro" ghcr.io/home-assistant/hassfest@sha256:f9ac52cfe0f7b8770334f191e6713aa9f10f0906a989bd38d75a4933534144c7

  actionlint:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rhysd/actionlint:1.7.12 by digest (shellcheck included): every workflow of the commit.
      - uses: docker://rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7 # 1.7.12
        with:
          args: -color
