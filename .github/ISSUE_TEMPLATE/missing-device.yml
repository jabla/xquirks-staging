name: Device without a file
description: Zigbee2MQTT supports your device, ZHA does not. This repo has no file for it.
title: "Missing: <vendor> <model>"
labels: [device]
body:
  - type: markdown
    attributes:
      value: |
        Check the [xquirks finder](https://jabla.github.io/xquirks/) first: your device may already have a file.

        Files are generated from the Zigbee2MQTT data, not written by hand. Some devices are left out for now (climate, cover, light and lock devices; features built from Zigbee2MQTT's own code). The answer may be that this one cannot be translated yet.
  - type: input
    id: z2m
    attributes:
      label: Zigbee2MQTT device page
      placeholder: https://www.zigbee2mqtt.io/devices/<model>.html
    validations:
      required: true
  - type: input
    id: fingerprint
    attributes:
      label: Manufacturer and model as ZHA shows them
      placeholder: _TZE204_xxxxxxxx / TS0601
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Device diagnostics
      description: Settings > Devices & services > the device > Download diagnostics. Drop the file here.
