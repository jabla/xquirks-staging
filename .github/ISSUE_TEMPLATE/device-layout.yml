name: Device layout
description: A quirk file from this repo does not fit the endpoints of your device. The integration's notice links here with everything filled in.
title: "Device layout: <manufacturer> <model>"
labels: [device layout]
body:
  - type: markdown
    attributes:
      value: The weekly search reads the device signature below and puts the file's clusters where your device has them. The signature the integration's notice fills in holds no name and no address of your device. Downloaded diagnostics hold more, such as the device's network address and attribute values. The search keeps only endpoints and clusters; the issue shows all you paste.
  - type: input
    id: file
    attributes:
      label: Quirk file
      placeholder: z2m_<vendor>_<model>.py (revision 1a2b3c4d)
    validations:
      required: true
  - type: input
    id: reason
    attributes:
      label: Why it does not fit
      placeholder: "it has no endpoint 1"
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
  - type: textarea
    id: signature
    attributes:
      label: Device signature
      description: As the device joined, before any quirk. Without the integration's link, the device's diagnostics (the device's page > three-dot menu > Download diagnostics), from which the search takes the signature before the quirk; for a device that runs no quirk, Manage Zigbee device > Signature in that menu is enough.
      render: json
    validations:
      required: true
