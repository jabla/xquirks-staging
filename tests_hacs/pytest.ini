# Tests of the Home Assistant integration in custom_components/, kept apart from the generated
# quirk tests in tests/ (own venv, see requirements.txt). Run from the repo root:
#   .venv-hacs/bin/python -m pytest tests_hacs
[pytest]
# Home Assistant puts its httpx alias in place on import; respx's own plugin would import httpx first.
addopts = -p no:respx
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = ..
testpaths = .
